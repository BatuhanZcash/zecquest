<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZecLearn — Offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6f6f4; color: #161513; font-family: system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 12px; }
      h1 { margin: 8px 0 0; font-size: 22px; }
      p { margin: 0; color: #6b6a66; max-width: 320px; line-height: 1.5; }
      button { margin-top: 16px; background: #f4b728; color: #1a1404; border: 0; border-radius: 10px; padding: 12px 24px; font-weight: 700; font-size: 16px; box-shadow: 0 3px 0 #c8920f; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="" style="border-radius:16px" />
      <h1>Bağlantı yok · You're offline</h1>
      <p>İnternete bağlanınca kaldığın yerden devam edersin. Oyun ilerlemen sunucuda güvende.</p>
      <p>Reconnect to pick up where you left off. Your game progress is safe on the server.</p>
      <button onclick="location.reload()">Tekrar dene · Retry</button>
    </main>
  </body>
</html>
